<html>
    <head>
        <title>Document</title>
    </head>

    <body>
        <h2><b>Conference Registration Form</b></h2>
        <form>
            Full Name:<br>
            <input type="text" id="name" name="name" placeholder="Enter your full name"><br>

            Email Address:<br>
            <input type="email" id="email" name="email" placeholder="Enter your email address"><br>

            Age:<br>
            <input type="number" id="age" name="age" placeholder="18" size="3"><br><br>

            Gender:<br><br>
            <input type="radio" id="male" name="gender" value="Male">Male <br>
            <input type="radio" id="female" name="gender" value="Female">Female <br><br>

            Country of Residence:<br>
            <select id="country" name="country">
                <option value="USA">USA</option>
                <option value="Malaysia" selected>Malaysia</option>
                <option value="Singapore">Singapore</option>
            </select><br><br>

            Area of Interest:<br><br>
            <input type="checkbox" id="Software Development" name="interest" value="Software Development">Software Development<br>
            <input type="checkbox" id="Data Science" name="interest" value="Data Science">Data Science<br>
            <input type="checkbox" id="Cybersecurity" name="interest" value="Cybersecurity">Cybersecurity<br>
            <input type="checkbox" id="Artificial Intelligence" name="interest" value="Artificial Intelligence">Artificial Intelligence<br>
            <br><br>
            
            Experience Level:<br><br>
            <input type="checkbox" id="beginner" name="experience" value="Beginner">Beginner<br>
            <input type="checkbox" id="intermediate" name="experience" value="Intermediate">Intermediate<br>
            <input type="checkbox" id="advanced" name="experience" value="Advanced">Advanced<br><br>
            
            Comments or Questions:<br>
            <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Any comments or questions?"></textarea><br>
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </form>
        
    </body>
</html>
